<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10sion</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #050a14;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      color: #e8edf5;
    }

    /* Animated grid */
    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(30,90,180,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,90,180,0.07) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridShift 20s linear infinite;
    }
    @keyframes gridShift {
      0%   { background-position: 0 0; }
      100% { background-position: 60px 60px; }
    }

    /* Glow blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
    }
    .blob-1 {
      width: 500px; height: 500px;
      background: #1e5cbf;
      top: -120px; left: -100px;
      animation: float1 12s ease-in-out infinite;
    }
    .blob-2 {
      width: 400px; height: 400px;
      background: #0e9aa7;
      bottom: -100px; right: -80px;
      animation: float1 12s ease-in-out infinite;
      animation-delay: -6s;
    }
    .blob-3 {
      width: 300px; height: 300px;
      background: #7c3aed;
      top: 50%; left: 50%;
      animation: float3 12s ease-in-out infinite;
      animation-delay: -3s;
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(-30px) scale(1.05); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%       { transform: translate(-50%, calc(-50% - 20px)) scale(1.05); }
    }

    /* SVG arcs */
    .arcs {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    /* Card */
    .card {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 3rem 4rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      max-width: 540px;
      width: 90%;
      box-shadow: 0 0 80px rgba(14,154,167,0.08), 0 24px 64px rgba(0,0,0,0.5);
    }

    .wordmark {
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(135deg, #a8d8ff 0%, #5ab4ff 40%, #0e9aa7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.25rem;
    }

    .tagline {
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(160,190,230,0.5);
      margin-bottom: 2.5rem;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, #5ab4ff, #0e9aa7);
      margin: 0 auto 2.5rem;
      border-radius: 2px;
    }

    .coming-soon {
      font-size: 1rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(200,220,255,0.65);
      margin-bottom: 0.75rem;
    }

    .message {
      font-size: 1.05rem;
      color: rgba(200,220,255,0.45);
      line-height: 1.65;
      font-weight: 300;
    }

    /* Pulse indicator */
    .pulse-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 2.5rem;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #0e9aa7;
      box-shadow: 0 0 10px #0e9aa7;
      animation: pulse 2.4s ease-in-out infinite;
    }
    .pulse-label {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(14,154,167,0.8);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.75); }
    }
  </style>
</head>
<body>

  <div class="grid"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <svg class="arcs" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="arcG1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#5ab4ff" stop-opacity="0"/>
        <stop offset="50%"  stop-color="#5ab4ff" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#5ab4ff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="arcG2" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#0e9aa7" stop-opacity="0"/>
        <stop offset="50%"  stop-color="#0e9aa7" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#0e9aa7" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M -100 700 Q 400 100 1000 500 T 1600 200" stroke="url(#arcG1)" stroke-width="1.2" fill="none">
      <animate attributeName="d"
        values="M -100 700 Q 400 100 1000 500 T 1600 200;
                M -100 600 Q 500 200 900 400 T 1600 300;
                M -100 700 Q 400 100 1000 500 T 1600 200"
        dur="14s" repeatCount="indefinite"/>
    </path>
    <path d="M 1600 100 Q 1000 600 400 300 T -200 700" stroke="url(#arcG2)" stroke-width="1" fill="none">
      <animate attributeName="d"
        values="M 1600 100 Q 1000 600 400 300 T -200 700;
                M 1600 200 Q 900 500 500 250 T -200 600;
                M 1600 100 Q 1000 600 400 300 T -200 700"
        dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M 200 -50 Q 600 400 1100 200 T 1500 800" stroke="url(#arcG1)" stroke-width="0.8" fill="none" opacity="0.5">
      <animate attributeName="d"
        values="M 200 -50 Q 600 400 1100 200 T 1500 800;
                M 300 -50 Q 700 350 1000 300 T 1500 900;
                M 200 -50 Q 600 400 1100 200 T 1500 800"
        dur="22s" repeatCount="indefinite"/>
    </path>
  </svg>

  <div class="card">
    <div class="wordmark">10sion</div>
    <div class="tagline">Something is coming</div>
    <div class="divider"></div>
    <div class="coming-soon">Coming Soon</div>
    <p class="message">We're building something new.<br>Check back soon.</p>
    <div class="pulse-wrap">
      <div class="dot"></div>
      <span class="pulse-label">In development</span>
    </div>
  </div>

</body>
</html>
